project_id = "patchguard-ai"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_Refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.analyze-review]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.review-code]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.health]
verify_jwt = false
import_map = "./functions/import_map.json"


